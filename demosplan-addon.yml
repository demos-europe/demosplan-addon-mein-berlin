demosplan_addon:
  humanName: mein.berlin Integration
  vendor: DEMOS plan GmbH
  description: |
    Integrates the mein.berlin API into the DEMOS plan platform.
  entry: DemosEurope\DemosplanAddon\DemosMeinBerlin\MeinBerlinAddon
  permissionInitializer: DemosEurope\DemosplanAddon\DemosMeinBerlin\Configuration\Permissions\PermissionInitializer
  ui:
    manifest: dist/assets-manifest.json
    hooks:
     interface.fields.to.transmit:
        entry: MeinBerlinAdditionalFields
     mein_berlin_districts:
        entry: MeinBerlinDistrictsAdmin
        options:
          permissions:
            - feature_set_mein_berlin_organisation_id
